<!doctype html>
<html lang="es" data-look="soft">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&family=Patrick+Hand&display=swap">
<style>
/* Renderizador determinista 1080x1920: window.setup(timeline) y window.frame(t). Sin animaciones CSS: todo se calcula en JS. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
:root{--f-display:"Bricolage Grotesque",system-ui,sans-serif;--f-body:"Figtree",system-ui,sans-serif;--f-hand:"Patrick Hand",cursive}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.bg{position:absolute;inset:0}
.l{position:absolute}
/* fondos */
.f-novela .bg{background:radial-gradient(ellipse 75% 45% at 50% 50%,#7B2A73 0,#3A0F3E 48%,#14051A 100%)}
.f-novela .spot{position:absolute;inset:0;background:radial-gradient(ellipse 34% 62% at 50% 0,rgba(255,220,240,.22),transparent 70%)}
.f-pizarra .bg{background:#FBFBF6;background-image:linear-gradient(#E3E9EC 2px,transparent 2px),linear-gradient(90deg,#E3E9EC 2px,transparent 2px);background-size:72px 72px}
.f-sitcom .bg{background:linear-gradient(#F4C98E 0 61%,#B9784A 61% 100%)}
.f-simulador .bg{background:#0A241D;background-image:linear-gradient(rgba(126,255,196,.07) 2px,transparent 2px),linear-gradient(90deg,rgba(126,255,196,.07) 2px,transparent 2px);background-size:84px 84px}
.f-mito .bg{background:linear-gradient(115deg,#C7243A 0 49.7%,#0F8A57 50.3% 100%)}
.deco{position:absolute;inset:0;pointer-events:none}
.win{left:640px;top:250px;width:300px;height:330px;background:linear-gradient(#9FD8F2,#D9F1FA);border:22px solid #FFF4E2}
.frame{left:120px;top:300px;width:220px;height:170px;background:#5C8C7A;border:18px solid #6B3F22}
.couch{left:-40px;right:-40px;top:1050px;height:230px;background:#5E7FB8;border-radius:60px 60px 0 0;box-shadow:inset 0 -40px 0 #4A68A0}
.lamp{left:90px;top:700px;width:22px;height:360px;background:#6B3F22}
.lamp::before{content:"";position:absolute;left:-70px;top:-120px;width:160px;height:130px;background:#FFE2A8;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.tray{left:0;right:0;bottom:0;height:46px;background:#C9CED3}
#curve{position:absolute;left:0;top:0;width:1080px;height:1920px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 60px rgba(255,0,60,.6);opacity:0}

/* badge superior */
.badge{left:60px;top:150px;font:800 34px var(--f-body);letter-spacing:.12em;text-transform:uppercase;padding:14px 28px;border-radius:16px;max-width:620px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-novela .badge{color:#FFC6E8;background:rgba(255,255,255,.1);border:2px solid rgba(255,198,232,.45)}
.f-pizarra .badge{color:#1b1b1b;font:400 50px var(--f-hand);letter-spacing:.02em;text-transform:none;border-bottom:8px solid #E5426A;border-radius:0;padding:0 6px}
.f-sitcom .badge{color:#3A1D08;background:#FFF4E2}
.f-simulador .badge{color:#0A241D;background:#7EFFC4}
.f-mito .badge{display:none}
.mitohead{left:0;right:0;top:225px;text-align:center;font:800 104px/1 var(--f-display);color:#fff;letter-spacing:-.02em;text-shadow:0 8px 0 rgba(0,0,0,.25)}
.mitohead i{font-style:normal;font-size:66px;opacity:.85}

/* panel de texto grande */
.panel{left:70px;right:70px;top:250px;height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;transform-origin:50% 50%}
.panel .big{font:800 150px/1 var(--f-display);letter-spacing:-.03em}
.panel .big.mid{font-size:112px}
.panel .big.long{font-size:84px;line-height:1.05}
.panel .small{font:700 46px/1.2 var(--f-body)}
.f-novela .panel .big{color:#FFD43B;text-shadow:0 0 60px rgba(255,212,59,.5)}
.f-novela .panel .small{color:#FFC6E8}
.f-pizarra .panel .big{font-family:var(--f-hand);font-weight:400;color:#1b1b1b}
.f-pizarra .panel .small{font-family:var(--f-hand);font-weight:400;font-size:58px;color:#1E8A52}
.f-sitcom .panel{background:#FFF4E2;border-radius:40px;top:270px;height:380px;left:110px;right:110px;box-shadow:0 14px 0 rgba(58,29,8,.25)}
.f-sitcom .panel .big{color:#C8102E}
.f-sitcom .panel .small{color:#3A1D08}
.f-simulador .panel .big{color:#7EFFC4;text-shadow:0 0 70px rgba(126,255,196,.55)}
.f-simulador .panel .small{color:#CFEFE2}
.f-mito .panel{top:360px;height:300px;left:80px;right:80px;background:#fff;border-radius:40px;box-shadow:0 22px 0 rgba(0,0,0,.25)}
.f-mito .panel .big{color:#1b1b1b;font-size:82px;line-height:1.1}
.stamp{left:0;right:0;top:330px;display:flex;justify-content:center}
.stamp span{font:800 150px/1 var(--f-display);color:#FFD43B;border:16px solid #FFD43B;padding:16px 50px;border-radius:36px;background:rgba(120,0,20,.55);transform:rotate(-7deg);text-align:center;max-width:960px}
.stamp span.long{font-size:96px}
.cd{left:600px;width:420px;top:780px;height:400px;text-align:center;font:800 330px/400px var(--f-display);color:#fff;text-shadow:0 12px 0 rgba(0,0,0,.25)}
.laugh{right:60px;top:640px;font:800 46px var(--f-body);color:#fff;background:#3A1D08;padding:12px 30px;border-radius:99px}
.endcard{left:0;right:0;top:300px;display:flex;justify-content:center}
.endcard span{font:800 74px/1.1 var(--f-display);color:#14221D;background:#F7BC2B;padding:28px 46px;border-radius:30px;transform:rotate(-3deg);box-shadow:0 14px 0 rgba(0,0,0,.25);text-align:center}

/* subtítulos */
.cap{left:70px;right:70px;top:1230px;text-align:center;font:800 76px/1.12 var(--f-display);color:#fff;paint-order:stroke;-webkit-text-stroke:18px #000;letter-spacing:-.01em}
.cap .w{opacity:.5}
.cap .w.lit{opacity:1}
.cap .w.now{color:#FFD43B}
.f-pizarra .cap{-webkit-text-stroke:0;color:#1b1b1b;font:400 88px/1.08 var(--f-hand)}
.f-pizarra .cap .w.now{color:#0F7A4E;background:#FFF07A}
.foot{left:70px;right:70px;top:1540px;text-align:center;font:600 30px var(--f-body);color:rgba(255,255,255,.72)}
.f-pizarra .foot,.f-sitcom .foot{color:rgba(30,20,10,.6)}
.wm{right:60px;top:150px;font:800 30px var(--f-body);color:rgba(255,255,255,.8);display:flex;align-items:center;gap:12px}
.wm i{width:40px;height:40px;border-radius:50%;background:#F7BC2B;border:5px solid #fff;display:inline-block}
.f-pizarra .wm{color:rgba(0,0,0,.55)}.f-pizarra .wm i{border-color:#1b1b1b}
.f-sitcom .wm{color:rgba(58,29,8,.7)}

/* actores */
.actor{position:absolute;transform-origin:50% 100%}
.actor svg{display:block;width:100%;height:auto;overflow:visible}
.mouth,.eye,.arm-r,.arm-l,.brow,.pupils,.m-o{transform-box:fill-box;transform-origin:center}
.arm-r{transform-origin:0% 100%}.arm-l{transform-origin:100% 0%}
.m-o,.m-smirk,.m-flat,.lids,.sweat,.bulb{display:none}
.ex-shock .m-smile,.ex-sly .m-smile,.ex-angry .m-smile,.ex-worried .m-smile,.ex-think .m-smile{display:none}
.ex-shock .m-o{display:inline}
.ex-shock .brows{transform:translateY(-7px)}
.ex-sly .m-smirk,.ex-sly .lids{display:inline}
.ex-angry .m-flat,.ex-worried .m-o,.ex-worried .sweat,.ex-think .m-flat,.ex-think .bulb{display:inline}
.ex-worried .m-o{transform:scale(.6)}
.ex-angry .brow-l{transform:rotate(20deg) translateY(4px)}
.ex-angry .brow-r{transform:rotate(-20deg) translateY(4px)}
.ex-worried .brow-l{transform:rotate(-16deg)}
.ex-worried .brow-r{transform:rotate(16deg)}
.ex-think .pupils{transform:translate(3px,-5px)}
.ex-think .brow-r{transform:translateY(-6px)}
.chr .fill-main{fill:var(--c-main)}
.chr .ln{stroke:var(--c-dark);stroke-width:4;stroke-linejoin:round}
.chr .limb{fill:none;stroke:var(--c-dark);stroke-width:6;stroke-linecap:round}
.chr .acc{fill:var(--c-acc)}
.chr .eyew{fill:#fff;stroke:var(--c-dark);stroke-width:2.5}
.chr .pupil{fill:#16110a}
.chr .shine{fill:#fff}
.chr .brow{fill:none;stroke:#2b1d08;stroke-width:5;stroke-linecap:round}
.chr .mth{fill:#7c1d22;stroke:#3d0c0f;stroke-width:2.5}
.chr .mline{fill:none;stroke:#3d0c0f;stroke-width:4.5;stroke-linecap:round}
.chr .cheek{fill:#FF7C8F;opacity:.45}
.chr .sweat path{fill:#7FD3FF;stroke:#2B87B8;stroke-width:2}
.chr .leaf{fill:#3DBE6E;stroke:#1C6B3A;stroke-width:3}
.chr .rim{fill:none;stroke:var(--c-dark);stroke-width:2.5;stroke-dasharray:2 7;opacity:.55}
.chr .gloss{fill:#fff;opacity:.35}
.chr .shoe{fill:#2A2320}
.chr .bulb circle{fill:#FFE45C;stroke:#B58A00;stroke-width:2.5}
.chr .bulb path{stroke:#B58A00;stroke-width:3;fill:none;stroke-linecap:round}
.chr .ink{fill:var(--c-dark)}
.chr .white{fill:#fff}
[data-look="soft"] .chr .ln{stroke:none}
[data-look="soft"] .chr .limb{stroke-width:9}
[data-look="soft"] .chr .eyew{stroke:none;fill:url(#g-eye)}
[data-look="soft"] .actor svg{filter:drop-shadow(0 16px 12px rgba(0,0,0,.3))}
[data-look="soft"] .chr .fill-main{fill:var(--gm)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
 <radialGradient id="g-eye" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE3EA"/></radialGradient>
</defs></svg>
<div id="stage"></div>
<script>
const HANDLE='@moni.finanzas';
/* ---------- personajes ---------- */
function face(x,y,s=1){
  return `<g class="face" transform="translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})">
  <g class="brows"><path class="brow brow-l" d="M${x-33} ${y-24} q11 -8 22 -1"/><path class="brow brow-r" d="M${x+11} ${y-25} q11 -7 22 1"/></g>
  <g class="eye"><ellipse class="eyew" cx="${x-21}" cy="${y}" rx="12.5" ry="15"/><ellipse class="eyew" cx="${x+21}" cy="${y}" rx="12.5" ry="15"/>
   <g class="pupils"><circle class="pupil" cx="${x-18}" cy="${y+3}" r="6.5"/><circle class="pupil" cx="${x+24}" cy="${y+3}" r="6.5"/>
   <circle class="shine" cx="${x-15.5}" cy="${y}" r="2.2"/><circle class="shine" cx="${x+26.5}" cy="${y}" r="2.2"/></g></g>
  <g class="lids"><path class="fill-main ln" d="M${x-35} ${y+1} a14 14 0 0 1 28 0 z" style="stroke-width:2.5"/><path class="fill-main ln" d="M${x+7} ${y+1} a14 14 0 0 1 28 0 z" style="stroke-width:2.5"/></g>
  <circle class="cheek" cx="${x-38}" cy="${y+26}" r="8"/><circle class="cheek" cx="${x+38}" cy="${y+26}" r="8"/>
  <g class="mouth"><path class="mth m-smile" d="M${x-17} ${y+28} q17 20 34 0 q-17 7 -34 0z"/><ellipse class="mth m-o" cx="${x}" cy="${y+36}" rx="9" ry="12"/>
   <path class="mline m-smirk" d="M${x-14} ${y+36} q15 7 28 -9"/><path class="mline m-flat" d="M${x-12} ${y+36} q12 -3 24 0"/></g>
  <g class="sweat"><path d="M${x+50} ${y-28} q7 11 0 16 q-7 -5 0 -16z"/></g>
  <g class="bulb"><circle cx="${x+58}" cy="${y-62}" r="13"/><path d="M${x+58} ${y-82} v-6 M${x+76} ${y-74} l5 -5 M${x+40} ${y-74} l-5 -5"/></g>
 </g>`;
}
function limbs(legs=true,armY=124){
  return (legs?`<path class="limb" d="M84 188 L80 222"/><path class="limb" d="M116 188 L120 222"/>
  <ellipse class="shoe" cx="74" cy="225" rx="13" ry="6.5"/><ellipse class="shoe" cx="126" cy="225" rx="13" ry="6.5"/>`:'')+
  `<g class="arm-l"><path class="limb" d="M36 ${armY} Q16 ${armY+16} 20 ${armY+38}"/><circle class="fill-main ln" cx="20" cy="${armY+41}" r="8"/></g>
  <g class="arm-r"><path class="limb" d="M164 ${armY-2} Q186 ${armY-18} 182 ${armY-42}"/><circle class="fill-main ln" cx="182" cy="${armY-45}" r="8"/></g>`;
}
const PAL={
 moni:['#F7BC2B','#9C6400','#FFD970',['#FFF0A8','#F7BC2B','#B87400']],

 zombi:['#9BC77A','#466B2E','#6E4B8C',['#D6F0C0','#9BC77A','#5E8A40']],
 gymzombi:['#9BC77A','#466B2E','#E5426A',['#D6F0C0','#9BC77A','#5E8A40']],

 fomito:['#A77BF0','#4E2B8C','#FFD43B',['#DDCBFF','#A77BF0','#6A3FC0']],
 atm:['#B8C2CC','#46525E','#2C3A47',['#E8EEF3','#B8C2CC','#7D8994']],
 chips:['#F25C3B','#8C2410','#FFD43B',['#FFB09E','#F25C3B','#B53519']],

};
const BODY={

  <path d="M60 46 q45 -30 90 0 l0 10 l-90 0z" class="acc"/>${face(105,128)}`,

  <circle cx="84" cy="196" r="16" class="ink"/><circle cx="156" cy="196" r="16" class="ink"/>${limbs(false,110)}${face(122,116,.9)}`,
 bottle:()=>`${limbs()}<rect x="84" y="14" width="42" height="26" rx="6" class="acc"/><path class="fill-main ln" d="M78 40 L132 40 L132 60 Q172 76 172 120 L172 188 Q172 200 160 200 L50 200 Q38 200 38 188 L38 120 Q38 76 78 60Z" style="stroke-width:5;opacity:.95"/>
  <rect x="40" y="120" width="130" height="34" class="white" style="opacity:.8"/>${face(105,108)}<rect x="68" y="92" width="76" height="22" rx="10" style="fill:#14181F"/><path d="M104 100 h4" style="stroke:#14181F;stroke-width:6"/>`,
 bow:()=>`${limbs()}<path d="M105 62 q-50 -50 -60 -10 q10 20 60 10 q50 10 60 -10 q-10 -40 -60 10z" class="acc"/><path d="M62 40 l-10 -26 l22 16z M148 40 l10 -26 l-22 16z" style="fill:#C8102E"/>
  <rect class="fill-main ln" x="34" y="62" width="142" height="134" rx="14" style="stroke-width:5"/><rect x="96" y="62" width="18" height="134" class="acc"/>${face(105,124)}`,
 fomito:()=>`${limbs()}<circle class="fill-main ln" cx="105" cy="120" r="74" style="stroke-width:5"/>${face(105,112)}
  <path d="M84 115 m-5 0 a5 5 0 1 1 10 0 a8 8 0 1 1 -16 0" style="fill:none;stroke:#fff;stroke-width:2.5"/><path d="M126 115 m-5 0 a5 5 0 1 1 10 0 a8 8 0 1 1 -16 0" style="fill:none;stroke:#fff;stroke-width:2.5"/>`,
 atm:()=>`${limbs()}<rect class="fill-main ln" x="30" y="30" width="150" height="172" rx="14" style="stroke-width:5"/><rect x="48" y="50" width="114" height="90" rx="8" class="acc"/>
  <rect x="70" y="160" width="70" height="10" rx="5" class="ink"/>${face(105,92,.9).replace(/class="eyew"/g,'class="eyew"')}`,
 chips:()=>`${limbs()}<path class="fill-main ln" d="M40 40 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10 l10 -10 l10 10 L176 200 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 l-10 10 l-10 -10 Z" style="stroke-width:4"/>
  <ellipse cx="105" cy="170" rx="48" ry="18" class="acc"/>${face(105,108)}`,
 car:()=>`<path class="fill-main ln" d="M14 150 Q14 118 44 112 L64 72 Q72 58 90 58 L140 58 Q156 58 166 72 L186 112 Q200 118 200 150 L200 176 L14 176Z" style="stroke-width:5"/>
  <path d="M74 76 L136 76 L156 110 L58 110Z" style="fill:#DFF3FF"/><circle cx="56" cy="180" r="22" style="fill:#2C2C2C"/><circle cx="156" cy="180" r="22" style="fill:#2C2C2C"/><circle cx="56" cy="180" r="8" class="white"/><circle cx="156" cy="180" r="8" class="white"/>${face(106,94,.72)}`,
 doc:()=>`${limbs()}<path class="fill-main ln" d="M40 24 L144 24 L176 56 L176 204 L40 204Z" style="stroke-width:4"/><path d="M144 24 L144 56 L176 56" style="fill:none;stroke:var(--c-dark);stroke-width:4"/>
  <path d="M60 160 h96 M60 176 h70 M60 192 h84" style="stroke:var(--c-acc);stroke-width:6"/>${face(108,100)}`,
 cuotin:()=>`${limbs()}<rect class="fill-main ln" x="44" y="60" width="122" height="128" rx="22" style="stroke-width:5"/><text x="105" y="178" text-anchor="middle" style="font:800 24px var(--f-display);fill:var(--c-dark)">1/12</text>${face(105,108,.9)}`,
 phone:()=>`${limbs()}<rect class="fill-main ln" x="46" y="20" width="118" height="190" rx="20" style="stroke-width:5"/><rect x="56" y="38" width="98" height="150" rx="8" class="acc"/>
  ${face(105,96,.85)}<path d="M70 140 q35 60 70 0 q-10 20 -35 22 q-25 -2 -35 -22z" class="white"/>`,
 shirt:()=>`<path class="fill-main ln" d="M70 30 L40 46 L10 92 L40 112 L52 96 L52 200 L158 200 L158 96 L170 112 L200 92 L170 46 L140 30 Q105 56 70 30Z" style="stroke-width:5"/>${limbs(true,130).split('<g class="arm-l">')[0]}${face(105,120)}`,
 jacket:()=>`<path class="fill-main ln" d="M70 26 L36 44 L8 120 L36 136 L50 110 L50 204 L160 204 L160 110 L174 136 L202 120 L174 44 L140 26 Q105 50 70 26Z" style="stroke-width:5"/><path d="M105 46 L105 204" style="stroke:var(--c-acc);stroke-width:5"/>
  ${limbs(true,130).split('<g class="arm-l">')[0]}${face(105,112)}`,
};
function charSVG(kind){
  const [main,dark,acc,g]=PAL[kind];const id='g-'+kind;
  const body=kind==='gymzombi'?BODY.zombi(true):BODY[kind]();
  return `<svg class="chr" viewBox="0 0 210 240" style="--c-main:${main};--c-dark:${dark};--c-acc:${acc}">
   <defs><radialGradient id="${id}" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="${g[0]}"/><stop offset=".5" stop-color="${g[1]}"/><stop offset="1" stop-color="${g[2]}"/></radialGradient></defs>
   <g style="--gm:url(#${id})">${body}</g></svg>`;
}

/* ---------- utilidades ---------- */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const back=x=>{x=clamp(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let TL,S={};
const LAYOUT={
 1:{moni:[270,540,640]},                 // left, width, top
 2:{moni:[40,470,700],a:[570,470,700]},
 3:{moni:[20,360,780],a:[360,360,780],b:[700,360,780]},
};
window.setup=function(tl){
  TL=tl;const st=document.getElementById('stage');
  st.className='f-'+tl.fmt;
  const deco={novela:'<div class="spot"></div><div class="vig" id="vig"></div>',
   pizarra:'<div class="l tray"></div>',
   sitcom:'<div class="l win"></div><div class="l frame"></div><div class="l lamp"></div><div class="l couch"></div>',
   simulador:'<svg id="curve" viewBox="0 0 1080 1920"><path id="cpath" d="" fill="none" stroke="rgba(126,255,196,.35)" stroke-width="10" stroke-linecap="round"/><path id="carea" d="" fill="rgba(126,255,196,.07)"/></svg>',
   mito:''}[tl.fmt];
  let badge=tl.serie;
  if(tl.fmt==='novela'){const m=tl.serie.match(/^T\d+ · (.+) · Cap\. (\d+)( \(final\))?/);badge=(m[3]?'Final':'Cap. '+m[2])+' · '+m[1];}
  if(tl.fmt==='sitcom')badge=tl.serie.replace('Sitcom: los ','').replace(/^g/,'G');
  if(tl.fmt==='simulador')badge='¿Y si…?';
  if(tl.fmt==='pizarra')badge='Pizarra express';
  st.innerHTML=`<div class="bg"></div><div class="deco">${deco}</div>
   <div class="l badge" id="badge">${esc(badge)}</div>
   <div class="l wm" id="wm"><i></i>${HANDLE}</div>
   ${tl.fmt==='mito'?`<div class="l mitohead" id="mhead">¿MITO <i>o</i> VERDAD?</div><div class="l stamp" id="stamp"><span class="${tl.verdict.length>9?'long':''}">${esc(tl.verdict)}</span></div><div class="l cd" id="cd"></div>`:''}
   ${tl.fmt==='sitcom'?'<div class="l laugh" id="laugh">[risas]</div>':''}
   <div class="l panel" id="panel"></div>
   <div class="l endcard" id="end"><span>Seguí a Moni 🔔<br><small style="font-size:46px">${tl.fmt==='novela'?'Próximo capítulo mañana':'Un tema nuevo cada día'}</small></span></div>
   <div id="actors"></div>
   <div class="l cap" id="cap"></div>
   <div class="l foot">Contenido educativo. No es asesoramiento financiero.</div>`;
  if(tl.fmt==='novela'&&/ · Cap\. 1$/.test(tl.serie)===false){}
  // actores
  const kinds=['moni',...tl.kinds];
  S.actors=kinds.map((k,i)=>{const el=document.createElement('div');el.className='actor';el.innerHTML=charSVG(k);document.getElementById('actors').appendChild(el);
    const first=k==='moni'?0:tl.scenes.findIndex(s=>s.kind===k);
    return {k,el,slot:i===0?'moni':(i===1?'a':'b'),first:first<0?0:first,blinkOff:i*1.37}});
  S.scene=-1;S.capWords=[];
  if(tl.fmt==='simulador'){let d='',a='';for(let i=0;i<=60;i++){const x=60+i*16,y=1180-Math.pow(i/60,2.2)*520;d+=(i?'L':'M')+x+' '+y.toFixed(1)}
    a=d+' L1020 1180 L60 1180Z';document.getElementById('cpath').setAttribute('d',d);document.getElementById('carea').setAttribute('d',a);
    const p=document.getElementById('cpath');S.clen=p.getTotalLength();p.style.strokeDasharray=S.clen;}
  return document.fonts.ready.then(()=>true);
};

function slotPos(actor,i){
  const visible=S.actors.filter(a=>i>=a.first);const n=visible.length;
  const L=LAYOUT[n]||LAYOUT[3];
  if(i<actor.first)return [1200,470,700];
  if(TL.fmt==='mito'&&n===1)return [40,520,660];
  const idx=visible.indexOf(actor);const key=['moni','a','b'][idx];
  return L[key];
}
function numParts(big){const m=big.match(/^(.*?)(\d[\d.]*(?:,\d+)?)(.*)$/);if(!m)return null;
  const raw=m[2];const dec=(raw.split(',')[1]||'').length;const val=parseFloat(raw.replace(/\./g,'').replace(',','.'));
  if(!(val>=10)||/[×÷→]/.test(big)||/\d.*\s.*\d/.test(big))return null;return {pre:m[1],val,dec,post:m[3]}}
const fmtNum=(v,dec)=>v.toLocaleString('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec});

window.frame=function(t){
  const sc=TL.scenes;let i=sc.length-1;for(let k=0;k<sc.length;k++){if(t<sc[k].start+sc[k].dur){i=k;break}}
  if(t<sc[0].start)i=0;
  const s=sc[i],ts=t-s.start;
  if(i!==S.scene){
    // panel
    const P=document.getElementById('panel');
    if(s.panel){const b=s.panel.big;const cls=b.length>14?'long':(b.length>8?'mid':'');
      P.innerHTML=`<div class="big ${cls}">${esc(b)}</div>${s.panel.small?`<div class="small">${esc(s.panel.small)}</div>`:''}`;S.num=numParts(b);}
    else{P.innerHTML='';S.num=null}
    P.style.display=s.panel?'flex':'none';
    if(TL.fmt==='mito'){P.style.display=i<=1?'flex':'none';P.innerHTML=`<div class="big">“${esc(TL.frase)}”</div>`}
    // subtítulos
    const C=document.getElementById('cap');C.style.fontSize=s.text.length>78?(TL.fmt==='pizarra'?'72px':'62px'):'';C.innerHTML=s.text.split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ');S.capWords=[...C.querySelectorAll('.w')];
    S.prev=S.scene;S.scene=i;
  }
  // panel pop + conteo
  const P=document.getElementById('panel');
  const pk=back((ts-0.06)/0.38);P.style.transform=`scale(${0.35+0.65*pk})`;P.style.opacity=clamp((ts-0.04)/0.12);
  if(S.num){const big=P.querySelector('.big');const k=ease((ts-0.1)/0.9);big.textContent=S.num.pre+fmtNum(S.num.val*k,k<1?0:S.num.dec)+S.num.post}
  // subtítulos karaoke
  const prog=clamp(ts/Math.max(.3,s.audio));const nl=Math.ceil(prog*S.capWords.length);
  S.capWords.forEach((w,k)=>{w.classList.toggle('lit',k<nl);w.classList.toggle('now',k===nl-1&&prog<1)});
  // fin
  const endStart=s.start+s.audio+0.35;const isLast=i===sc.length-1;
  const E=document.getElementById('end');const ek=isLast?back((t-endStart)/0.4):0;E.style.opacity=isLast?clamp((t-endStart)/0.15):0;E.style.transform=`scale(${0.4+0.6*ek})`;
  if(isLast&&t>endStart){P.style.opacity=Math.max(0,1-(t-endStart)/0.2)}
  // actores
  S.actors.forEach((a,ai)=>{
    const cur=slotPos(a,i),prev=i>0?slotPos(a,i-1):cur;const k=ease(ts/0.5);
    const pos=cur.map((v,j)=>prev[j]+(v-prev[j])*k);
    const talking=s.kind===a.k&&ts<s.audio;
    const ex=(s.ex&&s.ex[a.k])||'happy';
    const exCls=ex==='wave'?'ex-happy ex-wave':'ex-'+ex;
    if(a.el.dataset.ex!==exCls){a.el.className='actor '+exCls;a.el.dataset.ex=exCls}
    const bobF=talking?2.2:0.38,bobA=talking?14:8;
    let y=Math.sin((t+ai)*Math.PI*2*bobF)*bobA;
    let x=0,rot=0;
    if(ex==='shock'&&ts<0.6){x=Math.sin(ts*70)*10*(1-ts/0.6)}
    if(talking)rot=Math.sin(t*Math.PI*2*1.6)*2.2;
    const scl=talking?1.05:1;
    a.el.style.left=pos[0]+'px';a.el.style.width=pos[1]+'px';a.el.style.top=pos[2]+'px';
    a.el.style.transform=`translate(${x}px,${y}px) rotate(${rot}deg) scale(${scl})`;
    a.el.style.zIndex=talking?3:2;
    const m=a.el.querySelector('.mouth');
    if(m){const v=talking?0.25+0.85*Math.abs(Math.sin(t*Math.PI*2*3.3+Math.sin(t*7)*1.2)):1;m.style.transform=`scaleY(${v.toFixed(3)})`}
    const eye=a.el.querySelector('.eye');const bp=((t+a.blinkOff)%3.6);eye.style.transform=`scaleY(${bp<0.12?0.1:1})`;
    const arm=a.el.querySelector('.arm-r');if(arm)arm.style.transform=ex==='wave'?`rotate(${Math.sin(t*Math.PI*2*1.8)*16+4}deg)`:'none';
  });
  // decoraciones por formato
  if(TL.fmt==='novela'){const v=document.getElementById('vig');v.style.opacity=t<1.2?(0.9*(1-t/1.2)+0.15*Math.abs(Math.sin(t*9))):0;
    const st=document.getElementById('stage');const z=t<0.5?1.08-0.08*ease(t/0.5):1;st.style.transform=`scale(${z})`;}
  if(TL.fmt==='simulador'){const p=document.getElementById('cpath');const k=ease((t-0.3)/(TL.total*0.8));p.style.strokeDashoffset=S.clen*(1-k);document.getElementById('carea').style.opacity=k}
  if(TL.fmt==='sitcom'){const L=document.getElementById('laugh');const on=i===3;L.style.opacity=on?clamp((ts-0.5)/0.15):0;L.style.transform=`scale(${on?back((ts-0.5)/0.3):0.5})`}
  if(TL.fmt==='mito'){
    const H=document.getElementById('mhead');H.style.opacity=i<=1?1:0;
    const cd=document.getElementById('cd');if(i===1){const third=s.dur/3;const n=3-Math.floor(ts/third);const tt=(ts%third)/third;cd.textContent=n>0?n:'';cd.style.opacity=tt<0.85?1:1-(tt-0.85)/0.15;cd.style.transform=`scale(${1.6-0.6*ease(tt/0.2)})`}else{cd.style.opacity=0}
    const stp=document.getElementById('stamp');if(i>=2){const k=ease((t-sc[2].start)/0.35);stp.style.opacity=clamp((t-sc[2].start)/0.1);stp.style.transform=`scale(${2.4-1.4*k})`;}else stp.style.opacity=0;
  }
  return i;
};
</script>
</body>
</html>
